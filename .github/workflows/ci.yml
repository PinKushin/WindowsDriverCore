name: CI

# Every push and every pull request. Unit, protocol and integration all run
# here: the whole suite is roughly 40 seconds locally, so there is no argument
# for deferring any of it to a schedule. Mutation and fuzzing are the slow ones
# and they live in their own scheduled workflows.
on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  test:
    name: Build and test
    # windows-latest is not a preference. The automation layer is raw
    # IUIAutomation COM and every project targets net10.0-windows, so there is
    # no other runner this can build on, let alone run on.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore WindowsDriverCore.slnx

      # Separate from test so a compile failure is not reported as a test
      # failure. TreatWarningsAsErrors is on solution-wide, so this step is
      # also the zero-warnings gate.
      - name: Build
        run: dotnet build WindowsDriverCore.slnx --no-restore --configuration Release

      - name: Unit tests
        run: >
          dotnet test tests/WindowsDriverCore.Tests.Unit/WindowsDriverCore.Tests.Unit.csproj
          --no-build --configuration Release
          --logger "trx;LogFileName=unit.trx"

      - name: Protocol tests
        run: >
          dotnet test tests/WindowsDriverCore.Tests.Protocol/WindowsDriverCore.Tests.Protocol.csproj
          --no-build --configuration Release
          --logger "trx;LogFileName=protocol.trx"

      # These drive real windows on a real desktop. GitHub's Windows runners
      # have an interactive session, so this works — but which applications
      # exist there is not the same as on a developer machine. Fixtures that
      # cannot find their subject call Assert.Ignore, so watch the skip count:
      # a suite that silently skips its way to green is the failure mode this
      # repository has hit before.
      #
      # The Comparison category is excluded because it drives real WinAppDriver,
      # which is not installed here and takes six minutes when it is.
      - name: Integration and UI tests
        run: >
          dotnet test tests/WindowsDriverCore.Tests.Integration/WindowsDriverCore.Tests.Integration.csproj
          --no-build --configuration Release
          --filter "TestCategory!=Comparison"
          --logger "trx;LogFileName=integration.trx"

      # The gate that makes a silently-skipping suite loud.
      #
      # The first CI run passed with 23 of 116 integration tests executed and 93
      # skipped, on a green tick. 87 of those were one cause: "Calculator is not
      # available: The system cannot find the file specified".
      #
      # windows-latest is Windows SERVER 2025 (image windows-2025-vs2026), and
      # Server ships without the Microsoft Store and without the inbox UWP apps.
      # Calculator is not missing, it is unavailable by construction, so no
      # install step fixes this and neither does a newer image. The packaged
      # application launch path cannot be exercised here for the same reason.
      #
      # This is a RATCHET, and it counts what RAN rather than what did not.
      # The first version capped skips at 93 and failed on the next run at 95 —
      # the total itself moved, 116 to 118, so a skip ceiling drifts with it
      # while measuring nothing about coverage. Passed count is the quantity
      # that matters and it held steady at 23.
      #
      # RAISED 23 -> 50 on 2026-08-22, on the first green run this workflow ever
      # had. It sat at 23 while 56 tests were actually passing, which meant a
      # third of the suite could stop running without the build noticing - the
      # exact drift a ratchet exists to catch, left wide open by a floor nobody
      # moved.
      #
      # 50 rather than 56 deliberately. Two observations exist, not one: 53
      # passing in the last red run and 56 in the first green one. Several
      # ClickLadder fixtures skip according to which page Settings happens to
      # show, so the count has a genuine wobble in it and a floor set to the
      # high-water mark would fail on the next unlucky run. 50 locks in almost
      # all of the coverage and still leaves room for that wobble.
      #
      # The floor may only ever be raised, and raising it means moving a fixture
      # onto the WPF test subject — the only application present on both a
      # developer desktop and a Server runner, which is the argument for having
      # built it. A change that drops coverage fails here instead of passing
      # quietly.
      #
      # The rest CANNOT be covered on CI at all, and that is settled - see
      # docs/DECISIONS.md #1. A self-hosted runner on the Hyper-V guest was the
      # obvious idea and is refused twice over: this repository is PUBLIC, where
      # GitHub's own guidance is not to pair the two, and giving that guest a
      # network lets the Store update its apps - which is the confound that
      # already destroyed a baseline when Alarms & Clock renamed
      # AlarmSaveButton to PrimaryButton mid-investigation.
      #
      # The guest is a MEASUREMENT INSTRUMENT and needs pinned versions and no
      # network; CI is a REGRESSION GATE where drift is tolerable. They are
      # different jobs and CI does not need to do the guest's.
      - name: Fail if the suite skipped its way to green
        if: always()
        shell: pwsh
        run: |
          $floor = 50
          $trx = Get-ChildItem -Recurse -Filter integration.trx | Select-Object -First 1
          if (-not $trx) { throw "No integration.trx: the test step did not run." }

          [xml]$results = Get-Content $trx.FullName
          $counters = $results.TestRun.ResultSummary.Counters
          $passed = [int]$counters.passed
          $total = [int]$counters.total

          Write-Host "integration: $passed passed of $total, floor is $floor"

          if ($passed -lt $floor) {
            throw "Only $passed tests actually ran, floor is $floor. A skip reads as a pass — find the fixture that stopped finding its subject."
          }

      # Orphaned test applications survive a cancelled or failed run and the
      # next job on a fresh runner will not see them — but a self-hosted runner
      # would. Cheap insurance, and it documents which processes these tests
      # own.
      - name: Kill orphaned test applications
        if: always()
        run: >
          Get-Process CalculatorApp,SystemSettings,charmap,WindowsDriverCore.TestApp.Wpf,WinAppDriver
          -ErrorAction SilentlyContinue | Stop-Process -Force
        shell: pwsh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          # Deliberately NOT ignore. An empty upload here means no test ran,
          # and a warning that reads "No files were found" is exactly the kind
          # of annotation that leaves a workflow green while doing nothing.
          if-no-files-found: error
